version: "3.9"

services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data          # persist best_responses.json
      - whisper_cache:/root/.cache/huggingface  # cache downloaded model weights

  # Optional: local Ollama for LLM scoring
